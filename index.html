<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParaFiszki - OlyVIA Alternative</title>
    
    <!-- Konfiguracja PWA i Ikony -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <meta name="theme-color" content="#059669">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        /* Modal do powiększania zdjęć */
        .zoom-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .zoom-modal.active {
            display: flex;
            opacity: 1;
        }
        .zoom-modal img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            border-radius: 8px;
        }
        /* Płynne przejścia widoków */
        .view-section {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .view-section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Kolorowanie literówek */
        .input-correct { color: #16a34a; font-weight: bold; }
        .input-wrong { color: #ef4444; font-weight: bold; text-decoration: underline; }
        .input-missing { color: #9ca3af; font-weight: bold; text-decoration: underline; }
        
        /* Toast notification */
        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <!-- Rejestracja Service Workera -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker zarejestrowany pomyślnie:', reg.scope))
                    .catch(err => console.error('Błąd rejestracji Service Workera:', err));
            });
        }
    </script>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl opacity-0 pointer-events-none transform translate-y-4 z-50 font-medium">
        Wiadomość systemowa
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-[60] flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center transform scale-95 transition-transform duration-200" id="confirm-box">
            <div class="text-4xl mb-4">⚠️</div>
            <h3 class="text-xl font-bold mb-2 text-slate-800">Wymagane potwierdzenie</h3>
            <p id="confirm-text" class="mb-8 text-slate-600 text-sm">Czy na pewno chcesz to zrobić?</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeConfirm(false)" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium transition w-full">Anuluj</button>
                <button onclick="closeConfirm(true)" class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold transition w-full shadow-md">Usuń</button>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="categoryModal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-[60] flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 transform scale-95 transition-transform duration-200" id="category-box">
            <h3 class="text-xl font-bold mb-4 text-slate-800">Nowa kategoria</h3>
            <input type="text" id="new-category-input" placeholder="Wpisz nazwę (np. Hydrosfera)" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-4 focus:ring-blue-100 outline-none transition text-slate-800 font-medium mb-6">
            <div class="flex gap-3 justify-end">
                <button onclick="closeCategoryModal()" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium transition">Anuluj</button>
                <button onclick="saveNewCategory()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition shadow-md">Dodaj</button>
            </div>
        </div>
    </div>
